[package]
name = "tola-node"
version = "0.1.0"
edition = "2021"

[dependencies]
tola-types = { path = "../tola-types" }
tola-codec = { path = "../tola-codec" }
tola-crypto = { path = "../tola-crypto" }
tola-core = { path = "../tola-core" }
tola-state = { path = "../tola-state" }
tola-storage = { path = "../tola-storage" }
tola-execution = { path = "../tola-execution" }
tola-consensus = { path = "../tola-consensus" }
tola-mempool = { path = "../tola-mempool" }
tola-p2p = { path = "../tola-p2p" }
tola-rpc = { path = "../tola-rpc" }

[dev-dependencies]
tola-sdk = { path = "../tola-sdk" }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
sha2 = { version = "0.10", default-features = false }
ripemd = { version = "0.1", default-features = false }
num-bigint = { version = "0.4", default-features = false }
revm = { version = "43.0.3", default-features = false, features = ["std"] }

