[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tola"
version = "0.1.0"
description = "Official Python client SDK and bot tooling for TOLA Network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "TOLA Network Core Contributors" }]
keywords = ["tola", "blockchain", "sdk", "crypto", "web3", "bot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/tolanetwork/tola"
Documentation = "https://docs.tola.network"
